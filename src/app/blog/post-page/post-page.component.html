<div class="container">
  <router-outlet></router-outlet>
  @if (postForm) {
    <div class="foot-form" [formGroup]="postForm">
      <div class="fields">
        <div class="field-row">
          <div class="field">
            <div class="icon">📝</div>
            <input formControlName="title" placeholder="Title" [maxlength]="titleMaxLength">
          </div>
        </div>
        <div class="field-row">
          <div class="field textarea-row">
            <div class="icon">✏️</div>
            <textarea class="body-input" formControlName="body" placeholder="Post" rows="5"></textarea>
          </div>
        </div>
      </div>
      <div class="buttons">
        <button
          type="button"
          (click)="savePost()"
          [disabled]="postForm.invalid || saving"
          [attr.aria-label]="isEditMode ? 'Save post' : 'Add post'"
        >
          <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
                <stop offset="1" stop-color="#a7b3ff"/>
              </linearGradient>
              <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
              </filter>
            </defs>

            <g filter="url(#shadow)">
              @if (isEditMode) {
                <path fill="url(#grad)" d="M8 34 l7 -7 l11 11 l23 -23 l7 7 l-30 30z"/>
                <path d="M8 34 l7 -7 l11 11 l23 -23 l7 7 l-30 30z"
                      fill="none" stroke="#4a56cf" stroke-opacity="0.45" stroke-width="1.5"/>
              } @else {
                <path fill="url(#grad)" d="M28 10 h8 v18 h18 v8 H36 v18 h-8 V36 H10 v-8 h18z"/>
                <path d="M28 10 h8 v18 h18 v8 H36 v18 h-8 V36 H10 v-8 h18z"
                      fill="none" stroke="#4a56cf" stroke-opacity="0.45" stroke-width="1.5"/>
              }
            </g>
          </svg>
        </button>
      </div>
    </div>
  }
</div>
