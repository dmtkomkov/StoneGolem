<div class="m3-select">
  <button
    type="button"
    class="m3-menu-trigger m3-select-trigger"
    [cdkMenuTriggerFor]="optionsMenu"
    [disabled]="disabled"
  >
    <span>{{ selectedLabel }}</span>
    <span aria-hidden="true">&#9662;</span>
  </button>

  <ng-template #optionsMenu>
    <div class="m3-menu-panel m3-select-panel" cdkMenu>
      @for (option of options; track option.label + ':' + option.value) {
        <button
          type="button"
          class="m3-menu-item m3-select-item"
          cdkMenuItem
          (cdkMenuItemTriggered)="selectOption(option.value)"
          [class.selected]="option.value === value"
        >
          <span>{{ option.label }}</span>
          @if (option.value === value) {
            <span class="check" aria-hidden="true">&#10003;</span>
          }
        </button>
      }
    </div>
  </ng-template>
</div>
