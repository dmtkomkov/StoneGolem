<div class="container">
  <router-outlet></router-outlet>
  @if (paymentForm) {
    <div class="foot-form" [formGroup]="paymentForm">
      <div class="fields">
        @if (categoriesLoaded && categoryItems.length === 0) {
          <div class="hint">No payment categories yet. Create them through the API or import FireGolem data.</div>
        }
        <div class="field-row">
          <div class="field">
            <div class="icon">💰</div>
            <input
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="Amount"
              formControlName="amount"
              (keydown.enter)="createPayment()"
            >
            <sg-select class="currency-select" formControlName="currency" [items]="currencyItems"></sg-select>
          </div>
          <div class="field">
            <div class="icon">📂</div>
            <sg-select formControlName="categoryId" [items]="categoryItems" placeholder="Category"></sg-select>
          </div>
          <div class="field">
            <div class="icon">📅</div>
            <input type="date" formControlName="spentOn">
          </div>
        </div>
      </div>
      <div class="buttons">
        <button type="button" (click)="createPayment()" [disabled]="paymentForm.invalid || saving" aria-label="Add payment">
          <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
                <stop offset="1" stop-color="#a7b3ff"/>
              </linearGradient>
              <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
              </filter>
            </defs>

            <g filter="url(#shadow)">
              <path fill="url(#grad)" d="M28 10 h8 v18 h18 v8 H36 v18 h-8 V36 H10 v-8 h18z"/>
              <path d="M28 10 h8 v18 h18 v8 H36 v18 h-8 V36 H10 v-8 h18z"
                    fill="none" stroke="#4a56cf" stroke-opacity="0.45" stroke-width="1.5"/>
            </g>
          </svg>
        </button>
      </div>
    </div>
  }
</div>
