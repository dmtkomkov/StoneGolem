<div class="container">
  <div class="control-panel">
    <div class="tab" routerLink="step" routerLinkActive="active" queryParamsHandling="preserve">
      <span class="icon">👣</span>
      <span>Step</span>
    </div>
    <div class="tab" routerLink="goal" routerLinkActive="active" queryParamsHandling="preserve">
      <span class="icon">🎯</span>
      <span>Goal</span>
    </div>
    <div class="tab" routerLink="category" routerLinkActive="active" queryParamsHandling="preserve">
      <span class="icon">📂</span>
      <span>Category</span>
    </div>
    <sg-param-filter
      class="filter-select"
      [param]="stepParamName"
      [options]="stepFilterOptions"
    ></sg-param-filter>
  </div>
  <div class="main-content">
    <router-outlet/>
  </div>
</div>
